name: Rebuild Excel workbook

on:
  push:
    branches: [main]
    paths:
      - "data/readings.json"
      - "scripts/build_xlsx.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Build workbook
        run: python3 scripts/build_xlsx.py

      - name: Commit updated workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- blood_sugar_log.xlsx; then
            git add blood_sugar_log.xlsx
            git commit -m "Auto-rebuild blood_sugar_log.xlsx from data/readings.json"
            git push
          else
            echo "No changes to blood_sugar_log.xlsx"
          fi
